name: refresh

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate snapshot
        run: python scripts/validate_snapshot.py

      - name: Commit the check stamp when it changed
        run: |
          if [ -z "$(git status --porcelain -- data/last-check.json)" ]; then
            echo "No change to data/last-check.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-check.json
          git commit -m "chore: record snapshot check $(date -u +%Y-%m-%d)"
          git push
